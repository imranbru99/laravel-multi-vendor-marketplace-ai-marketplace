services:
  app:
    build: {context: ., target: app}
    env_file: .env
    environment: &runtime
      APP_ENV: production
      APP_DEBUG: "false"
      MARKETPLACE_DEMO: "false"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: ${DB_PASSWORD:?Set a database password}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
    volumes: [marketplace-storage:/var/www/html/storage]
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
  web:
    build: {context: ., target: web}
    ports: ["127.0.0.1:8080:80"]
    volumes: [marketplace-storage:/var/www/html/storage:ro]
    depends_on: [app]
    restart: unless-stopped
  worker:
    build: {context: ., target: app}
    env_file: .env
    environment: *runtime
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=60", "--sleep=2"]
    volumes: [marketplace-storage:/var/www/html/storage]
    depends_on: [app]
    restart: unless-stopped
  scheduler:
    build: {context: ., target: app}
    env_file: .env
    environment: *runtime
    command: ["php", "artisan", "schedule:work"]
    volumes: [marketplace-storage:/var/www/html/storage]
    depends_on: [app]
    restart: unless-stopped
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a database password}
    volumes: [marketplace-db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [marketplace-redis:/data]
    restart: unless-stopped
volumes:
  marketplace-storage:
  marketplace-db:
  marketplace-redis:
