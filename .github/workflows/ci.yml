name: Marketplace verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: marketplace_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo_sqlite, pdo_pgsql, zip
          coverage: none
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: npm ci --no-audit --no-fund && npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'marketplace_test' || ':memory:' }}
          DB_USERNAME: marketplace
          DB_PASSWORD: testing-only
      - run: composer audit --locked
      - name: Concurrent PostgreSQL transactions
        if: matrix.database == 'pgsql'
        env:
          PGPASSWORD: testing-only
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: marketplace_concurrency
          DB_USERNAME: marketplace
          DB_PASSWORD: testing-only
        run: |
          psql -h 127.0.0.1 -U marketplace -d postgres -c 'CREATE DATABASE marketplace_concurrency'
          php artisan migrate --force
          php tests/Concurrency/run.php
